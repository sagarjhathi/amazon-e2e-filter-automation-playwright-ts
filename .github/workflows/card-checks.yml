name: Card checks

# Runs only the card filter checks (tests/CardFilterChecks.spec.ts, with playwright.card-checks.config.ts): the filters checked on the
# product cards and the product pages. The jobs are the same as in main-suite.yml: type check, tests in 4 shards, then one job that
# merges the shards into one Playwright report and one Allure report and publishes them to gh-pages, in the folder card-checks/.
# The landing page (.github/pages/index.html) links both suites; each workflow publishes only its own reports and run line.
on:
  push:
    branches: [improve]
  # Manual run from the Actions tab. GitHub lists a manual workflow only once the file is on the default branch.
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: run only the tests whose name matches this text, for example "Mobile: Discount"'
        required: false
        default: ''

# A newer push to the same branch cancels the older, now outdated run. A manual run has a group of its own, so a push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Runs once, so a type error fails fast instead of failing in every shard.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  # One job per shard. Playwright splits the tests between shards by itself.
  test:
    name: test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      # Let the other shards finish when one fails, so the merged report is complete.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Two browsers per shard, with a 3 second pause on every action.
      - name: Run the card filter checks (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        env:
          PW_WORKERS: 2
          SLOWMO: 1500
          COLLECT_DIR: collected
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          npx playwright test -c playwright.card-checks.config.ts --shard=${{ matrix.shard }}/${{ strategy.job-total }} ${ONLY:+-g "$ONLY"} 2>&1 | tee checks-run.log

      # Artifact names must be unique per shard or the uploads overwrite each other.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report-card-checks/
          retention-days: 1

      # Same for the Allure results; the merge job combines them into one Allure report.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results-card-checks/
          retention-days: 1

      # What the tests read (the data to analyse) and the run log. Kept longer than the reports' inputs.
      - name: Upload what was read
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: card-checks-data-${{ matrix.shard }}
          path: |
            collected/
            checks-run.log
          if-no-files-found: warn
          retention-days: 30

  # Combines the per-shard results into one Playwright report and one Allure report,
  # then publishes both to the gh-pages branch (GitHub Pages), in the folder card-checks/.
  merge-reports:
    name: merge reports
    needs: test
    # Still merge when a shard failed; skip only when the tests never ran (for example a type error).
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write is needed to push to the gh-pages branch; actions: write to delete the per-shard artifacts.
    permissions:
      contents: write
      actions: write
    # The same group as the main workflow: only one publish at a time, so two runs never overwrite each other's work on gh-pages.
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: card-checks-playwright-report
          path: playwright-report/
          retention-days: 3

      # ---- Allure ----

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      # The gh-pages branch holds the published reports; we need the previous Allure report of the card checks
      # from it to carry the trend history forward.
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Copy previous Allure history (for trend graphs)
        run: |
          if [ -d site/card-checks/allure/history ]; then
            cp -r site/card-checks/allure/history allure-results/history
          fi

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      # Also downloadable, so a run that does not publish still has the merged Allure report.
      # Open it with "npx allure open <folder>"; browsers block its data loading from a plain file.
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: card-checks-allure-report
          path: allure-report/
          retention-days: 3

      # ---- Publish ----

      - name: Publish to gh-pages
        run: |
          cd site
          # Only the card-checks folder is replaced. The filter tests' reports and their run line are left as they are.
          rm -rf card-checks
          mkdir card-checks
          cp -r ../playwright-report card-checks/playwright
          cp -r ../allure-report card-checks/allure
          echo "Run #${{ github.run_number }} - commit ${GITHUB_SHA::7} - $(date -u +'%Y-%m-%d %H:%M UTC')" > card-checks/run-info.txt
          # The landing page links both suites. Without this, a first publish here would leave the old page, which has no link to the card checks.
          cp ../.github/pages/index.html index.html
          touch .nojekyll

          # One fresh commit each time, so the branch never grows with old reports.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan latest
          git add -A
          git commit -m "Publish card checks reports from run #${{ github.run_number }}"
          git push --force origin latest:gh-pages

      # ---- Clean up ----
      # The per-shard artifacts only exist to feed this job. Every step above succeeded, so the merged reports are
      # uploaded and published and the shard data can go. If any step above fails, this step is skipped and the
      # shard artifacts stay, so the merge can be re-run without re-running the tests.
      - name: Delete per-shard artifacts
        if: ${{ success() }}
        # Cleanup only: a failure here must not fail the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | test("^(blob-report|allure-results)-")) | .id' |
            xargs -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

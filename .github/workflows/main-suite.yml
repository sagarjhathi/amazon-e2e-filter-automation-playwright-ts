name: Main suite

# Discord messages (the webhook URL is the GitHub secret AMAZON_PLAYWRIGHT; a missing secret only skips the messages, it never fails a job):
#   1. "CI Test Started - shard N/M": one per shard, from the test job.
#   2. "Report Publish - <status>": one per run, the last step of the merge reports job.
#   3. "Lint and type check - failure": only when the typecheck job fails (tests and publish are then skipped).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Scheduled run. GITHUB_EVENT_NAME=schedule makes utils/RunConfig.ts use the
  # scheduled-run sample: all filter options and 5 products each.
  schedule:
  - cron: '23 20 * * *'   # 20:23 UTC = 01:53 AM IST daily (off the top of the hour, when GitHub drops more scheduled runs)
  # Manual run from the Actions tab; tick the box to use the same sample as the scheduled run.
  workflow_dispatch:
    inputs:
      full_run:
        description: 'Use the scheduled-run sample (all filter options, 5 products each)'
        type: boolean
        default: false

# A newer push to the same branch or pull request cancels the older, now outdated run.
# The scheduled run and manual runs get groups of their own so a push can never cancel them:
#   - schedule          -> the fixed group "weekly" (never cancelled)
#   - workflow_dispatch -> one group per run (never cancelled, never cancels another)
#   - push / pull_request -> one group per branch or pull request (older runs are cancelled)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'weekly' || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  # Runs once, so a type error fails fast instead of failing in every shard.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  # One job per shard. Playwright splits the tests between shards by itself (see docs/ci-and-sharding.md).
  test:
    name: test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: typecheck
    runs-on: ubuntu-latest
    # The scheduled run opens more tabs than a push run (slowMo adds to every action), so allow plenty of time.
    timeout-minutes: 240
    env:
      IS_CRON: ${{ inputs.full_run == true && 'true' || '' }}
    strategy:
      # Let the other shards finish when one fails, so the merged report is complete.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Notify Discord – Start of shard
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.AMAZON_PLAYWRIGHT }}
          TITLE: "CI Test Started - shard ${{ matrix.shard }}/${{ strategy.job-total }}"
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No Discord webhook secret (AMAZON_PLAYWRIGHT), message skipped"; exit 0; fi
          timestamp=$(TZ='IST-5:30' date +"%Y-%m-%d %I:%M %p IST")
          content=$(printf '%s\n' "**$TITLE**" "Triggered by: $ACTOR" "Branch: $BRANCH" "Start Time: $timestamp" "[View Run]($RUN_URL)")
          jq -n --arg content "$content" '{content: $content}' | curl -sS --fail -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Artifact names must be unique per shard or the uploads overwrite each other.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      # Same for the Allure results; the merge job combines them into one Allure report.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results/
          retention-days: 1

  # Combines the per-shard results into one Playwright report and one Allure report,
  # then publishes both to the gh-pages branch (GitHub Pages).
  merge-reports:
    name: merge reports
    needs: test
    # Still merge when a shard failed; skip only when the tests never ran (for example a type error).
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write is needed to push to the gh-pages branch; actions: write to delete the per-shard artifacts.
    permissions:
      contents: write
      actions: write
    # One publish at a time for THIS workflow, so two runs never overwrite each other's Allure history. The card checks workflow has its own
    # group, so the two workflows never queue behind (or cancel) each other. If they push at the same moment, the push step below
    # detects it and retries (compare-and-swap), so neither overwrites the other's folders.
    concurrency:
      group: pages-publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      # ---- Allure ----

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      # The gh-pages branch holds the published reports; we need the previous Allure report
      # from it to carry the trend history forward.
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Copy previous Allure history (for trend graphs)
        run: |
          if [ -d site/allure/history ]; then
            cp -r site/allure/history allure-results/history
          fi

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      # Also downloadable, so pull request runs (which do not publish) still have the merged Allure report.
      # Open it with "npx allure open <folder>"; browsers block its data loading from a plain file.
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 3

      # ---- Publish ----
      # Pull requests only build the reports; only master runs, the scheduled run and manual runs publish.

      - name: Publish to gh-pages
        if: ${{ github.event_name != 'pull_request' }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The card checks workflow publishes to the same branch at its own times. Each attempt starts from the CURRENT gh-pages,
          # replaces only this workflow's folders, and pushes one fresh commit (so the branch never grows with old reports).
          # --force-with-lease only accepts the push if gh-pages is still the commit this attempt started from. If the other
          # workflow pushed in between, the push is rejected and the next attempt starts again from the new state, so neither
          # workflow ever overwrites the other's folders.
          for attempt in 1 2 3 4 5 6; do
            git fetch --depth=1 origin gh-pages
            base=$(git rev-parse FETCH_HEAD)
            git reset --hard "$base"
            git clean -fdx

            # Remove the old reports of this workflow, then add the new ones. The card-checks/ folder is not touched.
            rm -rf playwright allure index.html enabledTests.json
            cp -r ../playwright-report playwright
            cp -r ../allure-report allure
            cp ../.github/pages/index.html index.html
            # The landing page shows this line under the filter tests. The card checks workflow writes its own line to card-checks/run-info.txt.
            echo "Run #$RUN_NUMBER - commit ${GITHUB_SHA::7} - $(date -u +'%Y-%m-%d %H:%M UTC')" > run-info.txt
            # The landing page reads this copy to list the tests switched off on purpose (they are in no report).
            cp ../testdata/enabledTests.json enabledTests.json
            touch .nojekyll

            git add -A
            commit=$(git commit-tree "$(git write-tree)" -m "Publish reports from run #$RUN_NUMBER")
            if git push --force-with-lease=gh-pages:"$base" origin "$commit":refs/heads/gh-pages; then
              exit 0
            fi
            echo "gh-pages changed while publishing (attempt $attempt of 6), trying again from the new state"
            sleep $((attempt * 5))
          done
          echo "Could not publish after 6 attempts"
          exit 1

      # ---- Clean up ----
      # The per-shard artifacts only exist to feed this job. Every step above succeeded, so the merged reports are
      # uploaded (and published, except on pull requests) and the shard data can go. If any step above fails, this
      # step is skipped and the shard artifacts stay, so the merge can be re-run without re-running the tests.
      - name: Delete per-shard artifacts
        if: ${{ success() }}
        # Cleanup only: a failure here (for example a read-only token on a fork pull request) must not fail the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | test("^(blob-report|allure-results)-")) | .id' |
            xargs -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

      # ---- Discord ----
      # Last step, so it also reports a run where an earlier step failed. It never fails the job.

      - name: Notify Discord – Publish result
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.AMAZON_PLAYWRIGHT }}
          JOB_STATUS: ${{ job.status }}
          TESTS_RESULT: ${{ needs.test.result }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No Discord webhook secret (AMAZON_PLAYWRIGHT), message skipped"; exit 0; fi
          timestamp=$(TZ='IST-5:30' date +"%Y-%m-%d %I:%M %p IST")

          lines=("**Report Publish - $JOB_STATUS**" "Tests job: $TESTS_RESULT")
          lines+=("Trigger: $EVENT" "Branch: $BRANCH" "Time: $timestamp" "[View Run]($RUN_URL)")
          if [ "$EVENT" != "pull_request" ]; then
            lines+=("[Report hub](https://$REPO_OWNER.github.io/$REPO_NAME/)")
          fi

          content=$(printf '%s\n' "${lines[@]}")
          jq -n --arg content "$content" '{content: $content}' | curl -sS --fail -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK"

  # Sent only when the typecheck job fails. "failure", not "not success": a run cancelled by a newer push must not say "needs a fix".
  notify-typecheck-failure:
    name: Notify typecheck failure
    needs: typecheck
    if: ${{ always() && needs.typecheck.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Discord – Lint and type check did not pass
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.AMAZON_PLAYWRIGHT }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No Discord webhook secret (AMAZON_PLAYWRIGHT), message skipped"; exit 0; fi
          timestamp=$(TZ='IST-5:30' date +"%Y-%m-%d %I:%M %p IST")
          content=$(printf '%s\n' "**Lint and type check - $TYPECHECK_RESULT**" "Tests and report publish were skipped, the lint and type check need a fix" "Trigger: $EVENT" "Branch: $BRANCH" "Time: $timestamp" "[View Run]($RUN_URL)")
          jq -n --arg content "$content" '{content: $content}' | curl -sS --fail -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK"

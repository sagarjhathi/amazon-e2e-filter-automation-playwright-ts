name: Collect card data (TEMPORARY)

# TEMPORARY, for gathering data only. Delete this file, tests-temp/ and playwright.layer1.config.ts when the analysis is done.
# Applies the card-readable filters (see tests-temp/TrustedFilters.spec.ts), saves what the product cards print to JSON files,
# and uploads them as the artifact "card-data". Nothing is compared, so a green run only means the data was collected.
on:
  # Manual run from the Actions tab. GitHub lists a manual workflow only once the file is on the default branch.
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: run only the tests whose name matches this text, for example "Mobile: RAM Size"'
        required: false
        default: ''
  # No push trigger: card-filter-checks.yml is the one that runs on a push to improve.

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # One worker, with a 6 second pause on every action, so Amazon sees one slow browser. A failed test still keeps the options it collected before failing.
      - name: Collect the cards
        env:
          PW_WORKERS: 1
          SLOWMO: 6000
          COLLECT_DIR: collected
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          npx playwright test -c playwright.layer1.config.ts tests-temp/TrustedFilters.spec.ts ${ONLY:+-g "$ONLY"} 2>&1 | tee collect-run.log

      - name: Upload the collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-data
          path: |
            collected/
            collect-run.log
          if-no-files-found: warn
          retention-days: 30
